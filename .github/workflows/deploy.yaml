name: Deploy FlashSend

on:
  push:
    branches: [main]

env:
  DOCKERHUB_USERNAME: admin3005

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go test ./...

  build-and-deploy:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BINARY=server
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/flashsend-server:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/flashsend-server:latest

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BINARY=worker
            VERSION=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/flashsend-worker:${{ github.sha }}
            ${{ env.DOCKERHUB_USERNAME }}/flashsend-worker:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo kubectl rollout restart deployment/flashsend-server -n flashsend-prod
            sudo kubectl rollout restart deployment/flashsend-worker -n flashsend-prod
            sudo kubectl rollout status deployment/flashsend-server -n flashsend-prod --timeout=120s
            sudo kubectl rollout status deployment/flashsend-worker -n flashsend-prod --timeout=120s
