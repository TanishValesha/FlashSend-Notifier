apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashsend-server
  namespace: flashsend-prod
  labels:
    app: flashsend-server
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flashsend-server
  template:
    metadata:
      labels:
        app: flashsend-server
    spec:
      containers:
        - name: server
          image: admin3005/flashsend-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: flashsend-config
            - secretRef:
                name: flashsend-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flashsend-secret
                  key: DATABASE_URL
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: flashsend-secret
                  key: AMQP_URL
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3