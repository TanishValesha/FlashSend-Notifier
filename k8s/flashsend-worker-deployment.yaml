apiVersion: apps/v1
kind: Deployment
metadata:
  name: flashsend-worker
  namespace: flashsend-prod
  labels:
    app: flashsend-worker
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: flashsend-worker
  template:
    metadata:
      labels:
        app: flashsend-worker
    spec:
      containers:
        - name: worker
          image: admin3005/flashsend-worker:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
              name: health
          envFrom:
            - configMapRef:
                name: flashsend-config
            - secretRef:
                name: flashsend-secret
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flashsend-secret
                  key: DATABASE_URL
            - name: AMQP_URL
              valueFrom:
                secretKeyRef:
                  name: flashsend-secret
                  key: AMQP_URL
            - name: HEALTH_ADDR
              valueFrom:
                configMapKeyRef:
                  name: flashsend-config
                  key: HEALTH_ADDR
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3