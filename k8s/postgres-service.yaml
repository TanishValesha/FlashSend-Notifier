apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: flashsend-prod
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      name: postgres

---

apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: flashsend-prod
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres